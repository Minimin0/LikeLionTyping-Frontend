name: Full MySQL E2E

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: likelion_typing_test
          MYSQL_USER: likelion
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      E2E_ADMIN_PASSWORD: test-admin-password
    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          path: frontend
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: Minimin0/LikeLionTyping-Backend
          ref: ${{ github.event_name == 'pull_request' && github.base_ref == 'develop' && 'feat/admin-operations-v2' || github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          path: backend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build backend
        working-directory: backend
        run: |
          chmod +x ./gradlew
          ./gradlew build
      - name: Start backend
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/likelion_typing_test?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: likelion
          SPRING_DATASOURCE_PASSWORD: testpass
          ADMIN_PASSWORD_HASH: $2y$10$fjQFGDB1ZaES0wfHccvPreMX.qfcwLA7Gdh9jMN/uQ3NJrNDQRwSm
          ADMIN_TOKEN_SECRET: ci-token-secret-at-least-32-characters
          ALLOWED_ORIGINS: http://localhost:5173
        run: |
          ./gradlew bootRun > backend.log 2>&1 &
          echo $! > backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/api/categories >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend.log
          exit 1
      - name: Frontend checks
        working-directory: frontend
        run: |
          npm ci
          npm test -- --run
          npm run lint
          npm run build
      - name: Run E2E A-J
        working-directory: frontend
        run: E2E_STATE_FILE=e2e-state.json npm run e2e:api
      - name: Restart backend against same MySQL
        working-directory: backend
        env:
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/likelion_typing_test?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
          SPRING_DATASOURCE_USERNAME: likelion
          SPRING_DATASOURCE_PASSWORD: testpass
          ADMIN_PASSWORD_HASH: $2y$10$fjQFGDB1ZaES0wfHccvPreMX.qfcwLA7Gdh9jMN/uQ3NJrNDQRwSm
          ADMIN_TOKEN_SECRET: ci-token-secret-at-least-32-characters
          ALLOWED_ORIGINS: http://localhost:5173
        run: |
          kill "$(cat backend.pid)"
          ./gradlew bootRun > backend-restart.log 2>&1 &
          echo $! > backend.pid
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:8080/api/categories >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat backend-restart.log
          exit 1
      - name: Run E2E K
        working-directory: frontend
        run: E2E_STATE_FILE=e2e-state.json E2E_VERIFY_EXISTING=1 npm run e2e:api
      - name: Stop backend
        if: always()
        working-directory: backend
        run: |
          if [ -f backend.pid ]; then kill "$(cat backend.pid)" || true; fi
      - name: Print backend logs on failure
        if: failure()
        working-directory: backend
        run: |
          cat backend.log || true
          cat backend-restart.log || true
